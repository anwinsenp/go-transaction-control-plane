# Single-broker KRaft Kafka cluster + the transaction-events topic, sized
# for Kind (see docs/decisions/0006-postgres-in-cluster.md's "same
# manifests, different StorageClass/sizing" pattern). #33's k3s/EC2 chart
# config reuses this shape with EBS-backed storage and more brokers.
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual-role
  namespace: kafka
  labels:
    strimzi.io/cluster: transaction-control-plane
spec:
  replicas: 1
  roles:
  - controller
  - broker
  storage:
    type: persistent-claim
    size: 2Gi
    class: standard
    deleteClaim: true
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 1Gi
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: transaction-control-plane
  namespace: kafka
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 4.3.0
    metadataVersion: 4.3-IV0
    listeners:
    - name: plain
      port: 9092
      type: internal
      tls: false
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
  entityOperator:
    topicOperator: {}
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: transaction-events
  namespace: kafka
  labels:
    strimzi.io/cluster: transaction-control-plane
spec:
  partitions: 12
  replicas: 1
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: transaction-events-dlq
  namespace: kafka
  labels:
    strimzi.io/cluster: transaction-control-plane
spec:
  partitions: 3
  replicas: 1
