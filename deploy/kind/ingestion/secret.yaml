# Dev-only fake credentials for the local Kind stack. Not a real API key,
# not reused anywhere outside this cluster — safe to check in for the same
# reason docker-compose.yml-style local dev secrets are.
apiVersion: v1
kind: Secret
metadata:
  name: ingestion-secret
type: Opaque
stringData:
  INGESTION_API_KEYS: "kind-local-dev-key"
