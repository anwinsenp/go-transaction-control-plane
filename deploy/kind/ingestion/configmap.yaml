# Non-secret ingestion config for Kind. INGESTION_API_KEYS lives in
# secret.yaml instead, since api_keys_from_env in cmd/ingestion/main.go
# treats it as bearer-token credential material.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ingestion-config
data:
  HTTP_ADDR: ":8080"
  GRPC_ADDR: ":9090"
  KAFKA_BROKERS: "transaction-control-plane-kafka-bootstrap.kafka.svc:9092"
  KAFKA_TOPIC: "transaction-events"
  INGESTION_KNOWN_TENANTS: "tenant-a,tenant-b"
